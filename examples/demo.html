<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yokai-render demo</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f5f2; --card: #ffffff; --ink: #1c1b19; --muted: #77736b; --line: #e6e3dc; --accent: #ff5a36; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141413; --card: #1d1c1a; --ink: #f2f0ea; --muted: #9a958b; --line: #2c2a27; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, sans-serif; }
    .card { width: 420px; padding: 28px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 10px 30px rgb(0 0 0 / .06); }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p { margin: 0 0 20px; color: var(--muted); }
    .row { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; outline: none; }
    input:focus { border-color: var(--accent); }
    button { padding: 10px 16px; border: 0; border-radius: 10px; background: var(--ink); color: var(--card); font: inherit; font-weight: 600; cursor: pointer; transition: scale 150ms cubic-bezier(.23, 1, .32, 1); }
    button:active { scale: .97; }
    ul { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 8px; }
    li { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); transition: opacity 300ms cubic-bezier(.23, 1, .32, 1), translate 300ms cubic-bezier(.23, 1, .32, 1); }
    @starting-style { li { opacity: 0; translate: 0 8px; } }
    .orb { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; margin-right: 8px; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { scale: 1.6; opacity: .5; } }
  </style>
</head>
<body>
  <main class="card">
    <h1><span class="orb"></span>Tiny todo</h1>
    <p>A demo page for testing yokai-render.</p>
    <form class="row" onsubmit="event.preventDefault(); add();">
      <input id="task" placeholder="Add a task" autocomplete="off">
      <button id="add" type="submit">Add</button>
    </form>
    <ul id="list"></ul>
  </main>
  <script>
    const input = document.getElementById('task');
    const list = document.getElementById('list');
    function add() {
      const text = input.value.trim();
      if (!text) return;
      const li = document.createElement('li');
      li.textContent = text;
      list.append(li);
      input.value = '';
    }
    // Synthetic clicks don't submit forms, so the button also adds directly.
    document.getElementById('add').addEventListener('click', (e) => { e.preventDefault(); add(); });
  </script>
</body>
</html>
